name: sudoku_solver
description: A Flutter application for solving Sudoku puzzles using native code.

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # camera: ^0.10.5
  image_picker: ^1.1.2
  ffi: ^2.1.0
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/resnet18_svhn_int8.onnx
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
